version: "2"
run:
  go: "1.26"
  build-tags:
    - audiocodec
linters:
  enable:
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - gosec
    - makezero
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (net.Conn).Close
        - (io.Closer).Close
        - (*os.File).Close
    gosec:
      excludes:
        - G104
        - G304
    govet:
      disable:
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - third_party
      - tools
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
