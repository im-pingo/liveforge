run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - typecheck
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - exportloopref
    - gosec
    - makezero
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - wastedassign

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gosec:
    excludes:
      - G104  # unhandled errors (too noisy for streaming server)
      - G304  # file path from variable (expected for config loading)
  errcheck:
    exclude-functions:
      - (net.Conn).Close
      - (io.Closer).Close
      - (*os.File).Close

issues:
  exclude-dirs:
    - vendor
    - third_party
    - tools
  max-issues-per-linter: 50
  max-same-issues: 5
